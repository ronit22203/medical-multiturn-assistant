[project]
name = "medical-multiturn-assistant"
version = "0.1.0"
description = "Neuro-Symbolic RPM Chat Agent with Deterministic Guardrails"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.35.0",
    "openai>=1.30.0",
    "datasets>=2.19.0"
]

[project.optional-dependencies]
cuda = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "trl>=0.8.0",
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "vllm>=0.4.2",
    "bitsandbytes>=0.43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
