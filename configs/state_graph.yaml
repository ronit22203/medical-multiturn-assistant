# configs/state_graph.yaml
states:
  1_onboarding:
    system_prompt: "You are an RPM assistant. Greet the patient and verify their identity."
    allowed_tools:
      - "verify_identity"
    next_states:
      - "2_device_setup"
    transition_trigger: "verify_identity_success"

  2_device_setup:
    system_prompt: "Guide the user to pair their pulse oximeter, BP device, scale, and thermometer with the tablet."
    allowed_tools:
      - "pair_device"
    next_states:
      - "3_troubleshooting" # If user reports failure
      - "4_education"       # If all devices paired
    transition_trigger: "devices_paired_or_issue_reported"

  3_troubleshooting:
    system_prompt: "Assist the user with resolving device connection issues."
    allowed_tools:
      - "troubleshoot_step"
    next_states:
      - "2_device_setup"    # Return to setup once resolved
    transition_trigger: "troubleshoot_resolved"

  4_education:
    system_prompt: "Educate the user on how to take vitals with their devices and initiate the measurement."
    allowed_tools:
      - "start_measurement"
    next_states:
      - "5_closing"
    transition_trigger: "measurement_complete"

  5_closing:
    system_prompt: "Thank the user and politely close the chat."
    allowed_tools: []
    next_states: []
    transition_trigger: "chat_closed"
